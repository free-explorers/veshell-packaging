name: Install smoke test

# Installs the published veshell-bin from every channel in a throwaway container
# and checks what a package manager cannot: that the libraries the compositor
# dlopen()s actually resolve, that the payload layout is intact, and that every
# shipped ELF links.
#
# This deliberately does not start the compositor. Containers have no /dev/dri,
# and installing a display server to fake one would itself pull several of the
# very libraries under test, hiding exactly the failure this job guards against.
# Starting the compositor (the DRM backend) is not covered here, and is not
# automated anywhere yet.
#
# The job waits, bounded, for the release's own build to appear on each channel
# before installing, and asserts the installed version matches release.json, so
# it can never quietly pass against a previous release. AUR and COPR serve the
# build synchronously, so they get a short budget and fail fast; OBS rebuilds
# and publishes server-side afterwards, on its own schedule. That has taken the
# publisher 10-85 minutes for 0.1.2 and over an hour for 0.1.3, which landed
# just after a 60 minute budget expired, so those four legs wait well past that.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to install from (for example v0.1.0)
        required: true
        type: string
  # Run once the Release pipeline has finished instead of racing it on the
  # release event: nothing reaches a channel until the prebuilt payloads exist,
  # and OBS rebuilds afterwards, so a run started at publish time always loses.
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}

jobs:
  smoke:
    name: ${{ matrix.name }}
    if: >-
      github.repository == 'free-explorers/veshell-packaging' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    # Must exceed the OBS legs' wait budget below: the publisher has taken over
    # an hour to promote a repository after the recipes were submitted.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            image: debian:13
            channel: deb:Debian_13
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            channel: deb:xUbuntu_26.04
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
            channel: zypper
          # openSUSE Slowroll has no published container image, so it is not
          # smoke-tested directly. It is a build target on OBS and shares
          # Tumbleweed's glibc (2.44) and its exact soname set, so this leg
          # covers it.
          # Leap 16.0 is the libdisplay-info.so.2 family, like Debian 13.
          # OBS names its build repository "16.0".
          - name: openSUSE Leap 16.0
            image: opensuse/leap:16.0
            channel: zypper:16.0
          - name: Fedora 44
            image: fedora:44
            channel: copr
          - name: Arch
            image: archlinux:base-devel
            channel: aur

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.tag }}
          persist-credentials: false

      - name: Install and check in ${{ matrix.name }}
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          expected="$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')"
          echo "expecting version prefix: $expected"
          # OBS publishes its repositories asynchronously, when its publisher
          # reaches them: the 0.1.2 repositories took between 10 and 85 minutes
          # to appear, and 0.1.3 outlasted a 60 minute budget. Give those legs
          # 150 minutes and let the channels that are already serving the build
          # fail fast instead.
          case "$CHANNEL" in
            deb:*|zypper*) wait_attempts=150; wait_sleep=60 ;;
            *)             wait_attempts=20;  wait_sleep=30 ;;
          esac
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e SMOKE_WAIT_ATTEMPTS="$wait_attempts" -e SMOKE_WAIT_SLEEP="$wait_sleep" \
            "${{ matrix.image }}" \
            bash ci/smoke-install.sh "$CHANNEL" "$expected"
