name: OBS distributions (temporary)

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-24.04
    container: opensuse/tumbleweed:latest
    timeout-minutes: 15
    steps:
      - name: Install tooling
        shell: bash
        run: zypper --non-interactive install osc curl findutils git

      - name: Dump offered distributions
        shell: bash
        env:
          OSC_CONFIG_CONTENT: ${{ secrets.OSC_CONFIG }}
        run: |
          set -uo pipefail
          install -d -m700 "$HOME/.config/osc"
          printf '%s\n' "$OSC_CONFIG_CONTENT" > "$HOME/.config/osc/oscrc"
          chmod 600 "$HOME/.config/osc/oscrc"
          osc api /distributions > /tmp/dist.xml
          echo "total distributions: $(grep -c '<distribution ' /tmp/dist.xml)"
          echo "=== all reponames ==="
          grep -oE '<reponame>[^<]*</reponame>' /tmp/dist.xml \
            | sed 's/<[^>]*>//g' | sort -u | sed 's/^/  /'
          echo "=== openSUSE-family entries (vendor/version/reponame/base) ==="
          tr -d '\n' < /tmp/dist.xml \
            | sed 's/<distribution /\n<distribution /g' \
            | grep -iE 'suse|SLE' \
            | sed 's/.*vendor="\([^"]*\)".*version="\([^"]*\)".*reponame>\([^<]*\)<.*project>\([^<]*\)<.*repository>\([^<]*\)<.*/  \1 | \2 | \3 | \4\/\5/'
