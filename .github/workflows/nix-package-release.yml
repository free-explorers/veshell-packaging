name: Nix Package Release

# Builds the Veshell package, SDK and shell from the pinned source commit and
# pushes the closures to the project Cachix cache. Consumers substitute them, so
# this workflow never builds the engine: the engine and runtime closures are
# pushed by free-explorers/flutter-engine-nix. No closure assets are published;
# the cache is the distribution channel.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nix-package-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    if: >-
      github.repository == 'free-explorers/veshell-packaging' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout the packaging repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check the tag against the release manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:?a release tag is required}"
          release_id="$(python3 -c 'import json; m = json.load(open("release.json")); p = m.get("prerelease"); print((m["version"] + "-" + p) if p else m["version"])')"
          if [[ "${tag#v}" != "$release_id" ]]; then
            printf 'error: tag %s does not match release.json (%s)\n' "$tag" "$release_id" >&2
            exit 1
          fi
          commit="$(python3 -c 'import json; print(json.load(open("release.json"))["commit"])')"
          [[ $commit =~ ^[0-9a-f]{40}$ ]]
          printf 'veshell_commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned Veshell source
        env:
          VESHELL_REPO: ${{ vars.VESHELL_REPO || 'free-explorers/veshell' }}
          VESHELL_COMMIT: ${{ steps.manifest.outputs.veshell_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet "https://github.com/${VESHELL_REPO}.git" .veshell
          git -C .veshell checkout --quiet "$VESHELL_COMMIT"
          test -f .veshell/flake.nix

      - name: Verify the recipes and Nix pins match the manifest
        run: python3 scripts/render-recipes.py --check --veshell-src .veshell

      - name: Reclaim unused runner tools and require 30 GiB
        shell: bash
        run: |
          set -euo pipefail
          nproc
          free -h
          df -h / /mnt
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          available=$(df --output=avail -B1 / | tr -dc '0-9')
          (( available >= 30 * 1024 * 1024 * 1024 ))

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            max-jobs = 1
            cores = 4
            experimental-features = nix-command flakes

      - name: Use the project cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: veshell
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Require the engine closure in the cache
        working-directory: .veshell
        shell: bash
        run: |
          set -euo pipefail
          engine=$(nix eval --raw .#engine.outPath)
          hash=${engine#/nix/store/}
          hash=${hash%%-*}
          if ! curl -fsS "https://veshell.cachix.org/$hash.narinfo" >/dev/null; then
            echo "Engine $engine is not in the veshell cache. Run the engine release workflow first." >&2
            exit 1
          fi

      - name: Build the package, SDK and shell (60 minute bound)
        working-directory: .veshell
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          setsid timeout --signal=INT --kill-after=60s 60m \
            nix build .#default .#sdk .#shell --print-out-paths --no-link \
              --max-jobs 1 --cores 4 > "$RUNNER_TEMP/roots" &
          pid=$!
          trap 'kill -INT -- -"$pid" 2>/dev/null || true' EXIT INT TERM
          while kill -0 "$pid" 2>/dev/null; do
            available=$(df --output=avail -B1 /nix/store | tr -dc '0-9')
            if (( available < 2 * 1024 * 1024 * 1024 )); then
              echo 'Stopping package build: less than 2 GiB remains.' >&2
              kill -TERM -- -"$pid" 2>/dev/null || true
              exit 1
            fi
            sleep 30
          done
          wait "$pid"
          trap - EXIT INT TERM
          cat "$RUNNER_TEMP/roots"
          package=$(sed -n '1p' "$RUNNER_TEMP/roots")
          test -x "$package/bin/veshell"

      - name: Push the package, SDK and shell to the cache
        working-directory: .veshell
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t roots < "$RUNNER_TEMP/roots"
          cachix push veshell "${roots[@]}"

      - name: Final resource sample
        if: always()
        shell: bash
        run: |
          free -h
          df -h / /mnt
