name: COPR group setup

# Temporary: create the free-explorers group COPR project (mirroring the chroots
# of the existing personal project) and verify it is usable.
on:
  workflow_dispatch:
    inputs:
      source:
        description: Existing COPR project to mirror chroots from
        required: true
        type: string
        default: papyelgringo/Veshell
      target:
        description: Group project to create
        required: true
        type: string
        default: "@free-explorers/veshell"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    container: fedora:latest
    timeout-minutes: 20
    steps:
      - name: Install copr-cli
        shell: bash
        run: dnf install -y python3 copr-cli

      - name: Create or verify the group project
        shell: bash
        env:
          COPR_CONFIG_CONTENT: ${{ secrets.COPR_CONFIG }}
          SOURCE: ${{ inputs.source }}
          TARGET: ${{ inputs.target }}
        run: |
          set -uo pipefail
          printf '%s\n' "$COPR_CONFIG_CONTENT" > /tmp/copr
          chmod 600 /tmp/copr
          copr() { copr-cli --config /tmp/copr "$@"; }

          echo "===== whoami ====="
          copr whoami || true
          echo "===== list group projects (access check) ====="
          copr list "${TARGET%%/*}" || true
          echo "===== source project ====="
          copr get "$SOURCE" || true

          echo "===== target project ====="
          if copr get "$TARGET" 2>/dev/null; then
            echo "target project already present"
            exit 0
          fi

          chroots="$(copr get "$SOURCE" 2>/dev/null | grep -oE '(fedora|rhel|centos|epel)-[a-z0-9]+-x86_64' | sort -u)"
          echo "chroots from source: ${chroots:-<none>}"
          args=()
          for c in $chroots; do args+=(--chroot "$c"); done
          if [ ${#args[@]} -eq 0 ]; then
            args=(--chroot fedora-rawhide-x86_64)
          fi

          echo "===== creating $TARGET ====="
          copr create "$TARGET" "${args[@]}" \
            --description "Veshell binary packages (free-explorers)" \
            --instructions "sudo dnf copr enable $TARGET"
          echo "===== verify ====="
          copr get "$TARGET" || true
