name: OBS status

# Temporary diagnostics: report the OBS build results for the veshell package.
on:
  workflow_dispatch:
    inputs:
      project:
        description: OBS project
        required: true
        type: string
        default: home:PapyElGringo
      package:
        description: OBS package
        required: true
        type: string
        default: veshell

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-24.04
    container: opensuse/tumbleweed:latest
    timeout-minutes: 20
    steps:
      - name: Install osc
        shell: bash
        run: zypper --non-interactive install osc git

      - name: Report OBS results
        shell: bash
        env:
          OSC_CONFIG_CONTENT: ${{ secrets.OSC_CONFIG }}
          PROJECT: ${{ inputs.project }}
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          install -d -m700 "$RUNNER_TEMP/osc"
          printf '%s\n' "$OSC_CONFIG_CONTENT" > "$RUNNER_TEMP/osc/oscrc"
          chmod 600 "$RUNNER_TEMP/osc/oscrc"
          osc() { command osc --config "$RUNNER_TEMP/osc/oscrc" "$@"; }

          echo "===== project meta ====="
          osc meta prj "$PROJECT"

          echo "===== osc results ====="
          osc results "$PROJECT" "$PACKAGE" || true

          for repo in openSUSE_Tumbleweed xUbuntu_26.04 Debian_13; do
            echo "===== buildlog tail: $repo/x86_64 ====="
            osc buildlog "$PROJECT" "$PACKAGE" "$repo" x86_64 2>&1 | tail -n 160 || true
          done
