name: COPR delete project

# One-off: delete a COPR project using the pipeline credentials.
on:
  workflow_dispatch:
    inputs:
      project:
        description: Project to delete
        required: true
        type: string
        default: papyelgringo/Veshell

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-24.04
    container: fedora:latest
    timeout-minutes: 15
    steps:
      - name: Install copr-cli
        shell: bash
        run: dnf install -y python3 copr-cli

      - name: Delete the project
        shell: bash
        env:
          COPR_CONFIG_CONTENT: ${{ secrets.COPR_CONFIG }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -uo pipefail
          printf '%s\n' "$COPR_CONFIG_CONTENT" > /tmp/copr
          chmod 600 /tmp/copr
          copr() { copr-cli --config /tmp/copr "$@"; }
          echo "===== before ====="
          copr get "$PROJECT" || true
          echo "===== delete ====="
          copr delete "$PROJECT" || true
          echo "===== after (expect failure) ====="
          if copr get "$PROJECT" 2>/dev/null; then
            echo "still present"
          else
            echo "project is gone"
          fi
